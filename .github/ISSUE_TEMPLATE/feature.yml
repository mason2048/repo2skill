name: Feature request
description: Propose a scoped static-compilation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow problem and target Agent.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Repository evidence and desired outcome
      description: Explain what static source should support the behavior and how it should be accepted.
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Can the feature remain fully static and non-executing?
      options:
        - "Yes"
        - "No or unsure"
    validations:
      required: true
