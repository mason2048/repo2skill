name: Bug report
description: Report a reproducible problem using a synthetic repository.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private repository content, local user paths, or vulnerabilities. Use Private Vulnerability Reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and a small public or synthetic repository layout.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision or version
      placeholder: commit SHA or 0.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 20, Git 2.50
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output and exit code
      description: Remove repository paths and any private content.
